# R5 Phase 2 — enforced egress allowlist.
# Built from FQDNs observed during Phase 1 (CoreDNS query log on personal GitHub account).
# Calico CE does not support FQDN matching; CIDRs used instead.
#
# Observed FQDNs (personal Copilot Free account):
#   github.com                           → 140.82.121.3
#   api.github.com                       → 140.82.121.5
#   api.individual.githubcopilot.com     → 140.82.112.21
#   telemetry.individual.githubcopilot.com → 140.82.114.22
#
# All resolve to 140.82.112.0/20 (GitHub published range).
# Re-resolve before R6; enterprise tenant may add Azure CDN endpoints.
# Captured: 2026-05-25
#
# On the real OpenShift cluster, RHACS (Advanced Cluster Security) generates and enforces
# this policy from live network flow data — no manual CIDR maintenance required (R7).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-egress
  namespace: aienclave-testuser
spec:
  podSelector:
    matchLabels:
      aienclave/egress: restricted
  policyTypes:
    - Egress
  egress:
    # Rule 1: DNS to kube-dns (CoreDNS) — required for all FQDN resolution.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Rule 2: HTTPS to GitHub IP range — covers all observed Copilot endpoints.
    - to:
        - ipBlock:
            cidr: 140.82.112.0/20
      ports:
        - protocol: TCP
          port: 443
