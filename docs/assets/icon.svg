<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2fff"/>
    </linearGradient>
    <filter id="g">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Shield -->
  <path d="M32 8 L52 17 L52 34 C52 46 43 55 32 58 C21 55 12 46 12 34 L12 17 Z"
        fill="none" stroke="url(#accent)" stroke-width="2" filter="url(#g)"/>

  <!-- Center dot -->
  <circle cx="32" cy="34" r="3.5" fill="#00d4ff" filter="url(#g)"/>

  <!-- Cross lines -->
  <line x1="22" y1="34" x2="28.5" y2="34" stroke="#00d4ff" stroke-width="1.5" opacity="0.9" filter="url(#g)"/>
  <line x1="35.5" y1="34" x2="42" y2="34" stroke="#7b2fff" stroke-width="1.5" opacity="0.9" filter="url(#g)"/>
  <line x1="32" y1="24" x2="32" y2="30.5" stroke="#00d4ff" stroke-width="1.5" opacity="0.9" filter="url(#g)"/>
  <line x1="32" y1="37.5" x2="32" y2="46" stroke="#7b2fff" stroke-width="1.5" opacity="0.9" filter="url(#g)"/>

  <!-- Satellite dots -->
  <circle cx="19" cy="34" r="2.5" fill="none" stroke="#00d4ff" stroke-width="1.5" filter="url(#g)"/>
  <circle cx="19" cy="34" r="1" fill="#00d4ff"/>

  <circle cx="45" cy="34" r="2.5" fill="none" stroke="#7b2fff" stroke-width="1.5" filter="url(#g)"/>
  <circle cx="45" cy="34" r="1" fill="#7b2fff"/>

  <circle cx="32" cy="21" r="2.5" fill="none" stroke="#00d4ff" stroke-width="1.5" filter="url(#g)"/>
  <circle cx="32" cy="21" r="1" fill="#00d4ff"/>
</svg>
